site_name: quantms
site_description: Cloud-ready Nextflow pipeline for DDA quantitative proteomics
site_author: BigBio Team
site_url: https://docs.quantms.org/
repo_name: bigbio/quantms
repo_url: https://github.com/bigbio/quantms
theme:
  name: material
  font: false
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
extra_css:
  - stylesheets/quantms-theme.css
nav:
  - Home: index.md
  - Usage: usage.md
  - Output: output.md
